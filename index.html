<!DOCTYPE html>
<html>
<head>
<title>SIMP Cult GTD Whitelist Checker</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        background: black;
    }

    /* Fullscreen video */
    #bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        opacity: 0.55;
    }

    /* Main card */
    .card {
        width: 450px;
        background: rgba(255, 255, 255, 0.92);
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 0 60px rgba(0,0,0,0.35);
        text-align: center;
        backdrop-filter: blur(6px);
    }

    input {
        width: 80%;
        padding: 12px;
        font-size: 15px;
        margin-right: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
    }

    button {
        padding: 12px 20px;
        font-size: 15px;
        background: #ff6f6b;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    #result {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
        padding: 15px;
        border-radius: 10px;
        background: #fff5dd;
    }

    /* Team credits bottom-left */
    .credits {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(255,255,255,0.88);
        padding: 12px 18px;
        border-radius: 15px;
        font-size: 13px;
        line-height: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
        backdrop-filter: blur(4px);
    }

    .credits a {
        color: #ff4f4f;
        text-decoration: none;
        font-weight: bold;
    }
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video id="bg-video" autoplay muted loop>
    <source src="lambedesign.mp4" type="video/mp4">
</video>

<div class="card">
    <h2>Check your Eligibility</h2>
    <p>Enter your Monad Wallet Address</p>

    <input id="wallet" placeholder="0x...">
    <button onclick="checkWL()">Search</button>

    <div id="result">Awaiting address input...</div>
</div>

<!-- TEAM CREDITS -->
<div class="credits">
    Founder — <a href="https://x.com/cryptodurgesh">@cryptodurgesh</a><br>
    Co-Founder — <a href="https://x.com/jani_shanu">@jani_shanu</a><br>
    Simp Artist — <a href="https://x.com/lambe1981">@lambe1981</a><br>
    HR & Commander — <a href="https://x.com/DexDev33">@DexDev33</a>
</div>

<script>
async function checkWL() {
    try {
        const wl = await fetch("gtdwhitelist.json").then(r => r.json());
        const addr = document.getElementById("wallet").value.trim().toLowerCase();
        if (!addr) return document.getElementById("result").innerText = "Please enter a valid address.";

        const eligible = wl.includes(addr);
        document.getElementById("result").innerText =
            eligible ? "ELIGIBLE for 2 GTD Mint" : "NOT Eligible";
    } catch (e) {
        document.getElementById("result").innerText = "Error loading whitelist.";
    }
}
</script>

</body>
</html>
