<!DOCTYPE html>
<html>
<head>
    <title>SIMP Cult GTD Checker</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        /* Fullscreen video background */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* Glass card */
        .card {
            width: 420px;
            padding: 30px;
            margin: 0 auto;
            margin-top: 8vh;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(18px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
            color: #fff;
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin-bottom: 14px;
            font-size: 15px;
            outline: none;
        }

        button {
            background: #ff6e6e;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 15px;
            color: white;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #ff5a5a;
        }

        #result {
            margin-top: 18px;
            font-size: 20px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
        }

        /* Bottom-left credits */
        .credits {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.15);
            padding: 12px 16px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            color: white;
            font-size: 13px;
            line-height: 1.45;
        }

        .credits a {
            color: #ffaaaa;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <!-- Background Video -->
    <video autoplay muted loop id="bgVideo">
        <source src="lambedesign.mp4" type="video/mp4">
    </video>

    <div class="card">
        <h2>Check your Eligibility</h2>
        <small>Enter your Monad Wallet Address</small>

        <input id="wallet" placeholder="0x..." />

        <button onclick="checkWL()">Search</button>

        <div id="result">Awaiting address input...</div>
    </div>

    <div class="credits">
        Founder — <a href="https://x.com/cryptodurgesh">@cryptodurgesh</a><br>
        Co-Founder — <a href="https://x.com/jani_shanu">@jani_shanu</a><br>
        Simp Artist — <a href="https://x.com/lambe1981">@lambe1981</a><br>
        HR & Commander — <a href="https://x.com/DexDev33">@DexDev33</a>
    </div>

<script>
async function checkWL() {
    const addr = document.getElementById("wallet").value.trim().toLowerCase();
    const resultBox = document.getElementById("result");

    if (!addr.startsWith("0x") || addr.length < 10) {
        resultBox.innerText = "Invalid wallet address.";
        return;
    }

    try {
        const wl = await fetch("gtdwhitelist.json").then(r => r.json());
        const eligible = wl.map(x => x.toLowerCase()).includes(addr);

        resultBox.innerHTML = eligible 
            ? "<span style='color:#00ff7f'>ELIGIBLE for 2 GTD Mint</span>" 
            : "<span style='color:#ff4d4d'>NOT Eligible</span>";

    } catch (e) {
        resultBox.innerText = "Error loading whitelist.";
    }
}
</script>

</body>
</html>
