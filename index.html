<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIMP Cult GTD Eligibility Checker</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
        color: #2c2c2c;
        overflow-x: hidden;
    }

    /* Background Video */
    #bgVideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -3;
        opacity: 0.52;
        filter: blur(3px) brightness(0.75);
    }

    /* Soft Overlay */
    #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(255, 244, 225, 0.65);
        backdrop-filter: blur(6px);
        z-index: -2;
    }

    /* Main Content Box */
    .container {
        max-width: 520px;
        margin: 120px auto;
        background: rgba(255, 255, 255, 0.92);
        padding: 38px;
        border-radius: 18px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.18);
        text-align: center;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 8px;
        font-weight: 700;
    }

    h2 {
        font-size: 15px;
        opacity: 0.8;
        margin-bottom: 28px;
        font-weight: 400;
    }

    .inputBox {
        display: flex;
        gap: 10px;
        justify-content: center;
    }

    input {
        width: 100%;
        padding: 16px;
        border: 1.6px solid #d6c8b6;
        border-radius: 12px;
        font-size: 16px;
        background: #fff9f3;
        transition: 0.25s;
    }

    input:focus {
        border-color: #ff7a6a;
        background: #fff;
        outline: none;
    }

    button {
        padding: 14px 26px;
        background: #ff7b6b;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: 0.25s;
        box-shadow: 0px 4px 12px rgba(255, 100, 100, 0.25);
    }

    button:hover {
        background: #ff5e54;
        transform: translateY(-2px);
    }

    #resultBox {
        margin-top: 25px;
        padding: 20px;
        min-height: 40px;
        font-size: 20px;
        border-radius: 14px;
        background: #fff4de;
        font-weight: 600;
        color: #4a4a4a;
        transition: 0.3s ease;
    }

    /* Team Credits */
    .teamBox {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(255, 248, 236, 0.9);
        padding: 14px 20px;
        border-radius: 14px;
        box-shadow: 0px 5px 20px rgba(0,0,0,0.12);
        font-size: 13px;
        line-height: 1.45;
    }

    .teamBox a {
        color: #ff6a5c;
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>

<body>

<!-- Background Video -->
<video autoplay muted loop id="bgVideo">
    <source src="lambedesign.mp4" type="video/mp4" />
</video>

<div id="overlay"></div>

<!-- Main Panel -->
<div class="container">
    <h1>Check your Eligibility</h1>
    <h2>Enter your Monad Wallet Address</h2>

    <div class="inputBox">
        <input id="wallet" placeholder="0x..." />
        <button onclick="checkWL()">Search</button>
    </div>

    <div id="resultBox">Awaiting address input…</div>
</div>

<!-- Team Credits -->
<div class="teamBox">
    <div>Founder — <a href="https://x.com/cryptodurgesh" target="_blank">@cryptodurgesh</a></div>
    <div>Co-Founder — <a href="https://x.com/jani_shanu" target="_blank">@jani_shanu</a></div>
    <div>Simp Artist — <a href="https://x.com/lambe1981" target="_blank">@lambe1981</a></div>
    <div>HR & Commander — <a href="https://x.com/DexDev33" target="_blank">@DexDev33</a></div>
</div>

<script>
async function checkWL() {
    const box = document.getElementById("resultBox");
    const addr = document.getElementById("wallet").value.trim().toLowerCase();

    if (!addr.startsWith("0x") || addr.length < 12) {
        box.innerText = "Invalid wallet address.";
        box.style.color = "#ff3b3b";
        return;
    }

    box.innerText = "Checking…";
    box.style.color = "#4a4a4a";

    try {
        const wl = await fetch("gtdwhitelist.json").then(r => r.json());
        const eligible = wl.map(x => x.toLowerCase()).includes(addr);

        box.innerText = eligible ? "ELIGIBLE for 2 GTD Mint" : "NOT ELIGIBLE";
        box.style.color = eligible ? "#0d9f54" : "#ff3b3b";

    } catch (e) {
        box.innerText = "Error loading whitelist.";
        box.style.color = "#ff3b3b";
    }
}
</script>

</body>
</html>
