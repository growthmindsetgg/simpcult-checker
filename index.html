<!DOCTYPE html>
<html>
<head>
  <title>Whitelist Checker</title>
  <style>
    body { 
      font-family: Arial; 
      max-width: 400px; 
      margin: 60px auto; 
      text-align: center; 
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 15px 0;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #result { 
      margin-top: 20px; 
      font-size: 20px; 
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>SIMP Cult GTD Whitelist Checker</h2>

  <input id="wallet" placeholder="Enter wallet address">
  <button onclick="checkWL()">Check</button>

  <p id="result"></p>

  <script>
    async function checkWL() {
      const wl = await fetch("gtdwhitelist.json").then(r => r.json());
      const addr = document.getElementById("wallet").value.trim().toLowerCase();
      const eligible = wl.includes(addr);

      document.getElementById("result").innerText =
        eligible ? "ELIGIBLE for GTD / Free Mint" : "NOT Eligible";
    }
  </script>
</body>
</html>
