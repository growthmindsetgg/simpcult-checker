<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SIMP Cult GTD Checker</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, sans-serif; }

    body {
        overflow: hidden;
        height: 100vh;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Fullscreen video */
    #bgVideo {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 130%;
        height: auto;
        transform: translate(-50%, -50%);
        object-fit: cover;
        filter: brightness(1.15) contrast(1.05);
        z-index: -2;
    }

    /* Subtle dark overlay for readability */
    .overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(1px);
        z-index: -1;
    }

    /* Main glass box */
    .panel {
        width: 430px;
        padding: 25px 30px;
        border-radius: 18px;
        background: rgba(255,255,255,0.14);
        backdrop-filter: blur(18px) saturate(180%);
        box-shadow: 0 8px 25px rgba(0,0,0,0.45);
        text-align: center;
    }

    h2 {
        color: #fff;
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 12px;
        letter-spacing: 0.4px;
        text-shadow: 0 0 8px rgba(0,0,0,0.7);
    }

    p.label {
        color: #eee;
        font-size: 13px;
        margin-bottom: 8px;
        opacity: 0.9;
    }

    input {
        width: 100%;
        padding: 12px 14px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        margin-bottom: 12px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #ff7f7f;
        color: white;
        font-size: 15px;
        cursor: pointer;
        margin-bottom: 15px;
        transition: 0.2s;
    }

    button:hover {
        background: #ff6262;
    }

    #result {
        padding: 12px;
        border-radius: 10px;
        background: rgba(255,255,255,0.23);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        text-shadow: 0 0 6px rgba(0,0,0,0.6);
    }

    /* Bottom-left team credits */
    .credits {
        position: fixed;
        left: 20px;
        bottom: 20px;
        padding: 10px 18px;
        font-size: 13px;
        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        color: #eee;
        line-height: 1.45;
    }

    .credits a {
        color: #ffb3b3;
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>

<body>

<video id="bgVideo" autoplay muted loop playsinline>
    <source src="lambedesign.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="panel">
    <h2>Check your Eligibility</h2>
    <p class="label">Enter your Monad Wallet Address</p>

    <input id="wallet" placeholder="0x...">
    <button onclick="checkWL()">Search</button>

    <div id="result">Awaiting address input...</div>
</div>

<div class="credits">
    Founder — <a href="https://x.com/cryptodurgesh">@cryptodurgesh</a><br>
    Co-Founder — <a href="https://x.com/jani_shanu">@jani_shanu</a><br>
    Simp Artist — <a href="https.com/lambe1981">@lambe1981</a><br>
    HR & Commander — <a href="https.com/DexDev33">@DexDev33</a>
</div>

<script>
async function checkWL() {
    const r = document.getElementById("result");
    r.innerText = "Checking...";
    const addr = document.getElementById("wallet").value.trim().toLowerCase();
    if (!addr) return r.innerText = "Enter valid wallet address";

    const wl = await fetch("gtdwhitelist.json").then(res => res.json());
    const eligible = wl.map(x => x.toLowerCase()).includes(addr);

    r.innerText = eligible ? "ELIGIBLE for 2 GTD Mint" : "NOT Eligible";
}
</script>

</body>
</html>
